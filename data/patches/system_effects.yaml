description: "  Patch in system-wide effect buffs: wormhole system effects (Black Hole,\n  Cataclysmic Variable, Magnetar,\
  \ Pulsar, Red Giant, Wolf Rayet; classes\n  1-6) and metaliminal/volatile storms (Electrical, Exotic Matter, Gamma\n  Ray,\
  \ Plasma Firestorm, Volatile Ice; weak/strong).\n\n  In EVE Online these effects are delivered as System-category dogma\
  \ effects\n  on in-space \"effect beacon\" items. This patch models them as buff\n  collections, mirroring how the client\
  \ delivers other system-wide effects\n  (weather, sovereignty upgrades) via dbuffcollections. The buff strength\n  per wormhole\
  \ class / storm strength is supplied by the fit input,\n  resolved from the active snapshot's beacon dogma at runtime\n\
  \  (tool/system_effects/extract_wormhole.py).\n\n  `chargeRequiredSkillModifiers` and `penalized: false` are hand-authored\n\
  \  extensions: charge modifiers cover effects that target charge attributes\n  (missile/bomb damage, velocity, explosion\
  \ radius/velocity), and\n  `penalized: false` marks effects that are not stacking-penalized in-game\n  (hull HP, capacitor,\
  \ heat damage, overload, smart bomb and rep duration\n  bonuses).\n"
